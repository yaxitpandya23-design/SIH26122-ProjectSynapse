version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_synapse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_synapse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
